{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>
        {% block title %} Tweet App {% endblock %}
    </title>
    <style>
        .navbar-custom {
            background: linear-gradient(90deg, #5593f0, #9253f8);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .nav-link.active {
            font-weight: 600;
            color: #fff !important;
        }
        .search-input {
            border-radius: 50px;
            padding-left: 15px;
        }
        .avatar-circle {
            width: 30px;
            height: 30px;
            background-color: #ffc107;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'tweet_list' %}">Tweet Bar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <!-- Left Links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'tweet_list' %}active{% endif %}" 
                           href="{% url 'tweet_list' %}">Home</a>
                    </li>
                </ul>

                <!-- Search -->
                <form class="d-flex" role="search" method="get" action="{% url 'search' %}">
                <input name="q" class="form-control me-2" type="search" placeholder="Search tweets..." aria-label="Search">
                <button class="btn btn-outline-success me-1" type="submit">Search</button>
              </form>


                <!-- Auth Buttons -->
                {% if user.is_authenticated %}
                    <div class="d-flex align-items-center me-3">
                        <div class="avatar-circle me-2">{{ user.username|first }}</div>
                        <span class="text-white me-3">{{ user.username }}</span>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="btn btn-danger btn-sm">Logout</button>
                        </form>
                    </div>
                {% else %}
                    <a href="{% url 'register' %}" class="btn btn-outline-light me-2">Register</a>
                    <a href="{% url 'login' %}" class="btn btn-success">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
